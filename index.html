<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    
    <title>Playing Cards</title>
</head>
<body>
     <h1>Cards</h1>
<main id="playing-cards">
  <div class="card">
    <div class="left">
      <h2>A</h2>
      <p>♠</p>
    </div>
     <div class="middle"><p>♠</p></div>
    <div class="right">
      <h2>A</h2>
      <p>♠</p>
    </div>
    </div>
  <div class="card">
    <div class="left">
      <h2>2</h2>
      <p>♣</p>
    </div>
    <div class="middle">
      <p>♣</p>
      <p class="rote">♣</p>
    </div>
    <div class="right">
      <h2>2</h2>
      <p>♣</p>
    </div>
    </div>
  <div class="card red">
    <div class="left">
      <h2>3</h2>
      <p>♥</p>
    </div>
    <div class="middle">
      <p>♥</p>
      <p>♥</p>
      <p class="rote">♥</p>
    </div>
    <div class="right">
      <h2>3</h2>
      <p>♥</p>
    </div>
    </div>
  <div class="card">
    <div class="left">
      <h2>4</h2>
      <p>♣</p>
    </div>
    <div class="middle">
      <p>♣♣</p>
      
      <p class="rote">♣♣</p>
    </div>
    <div class="right">
      <h2>4</h2>
      <p>♣</p>
    </div>
</div>
  <div class="card red">
    <div class="left">
      <h2>5</h2>
      <p>♦</p>
    </div>
    <div class="middle">
      <p>♦♦</p>
      <p>♦</p>
      <p class="rote">♦♦</p>
    </div>
    <div class="right">
      <h2>5</h2>
      <p>♦</p>
    </div>
</div>
 
</main>
</body>
</html>
